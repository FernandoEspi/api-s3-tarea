org: TU_ORG                      # <-- reemplaza por tu org de Serverless (la del docente/tu cuenta)
service: api-s3

provider:
  name: aws
  runtime: python3.12            # el taller usa 3.9, pero AWS ya lo deprecó; 3.12 funciona igual
  region: us-east-1
  timeout: 29
  iam:
    role: arn:aws:iam::TU_ACCOUNT_ID:role/LabRole   # <-- reemplaza por tu role
  # stage por defecto = dev  ->  serverless deploy --stage test | prod

functions:
  # ---------- Ejercicio 1 (ya implementadas por el docente) ----------
  lista_buckets:
    handler: lista_buckets.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /s3/lista-buckets
          method: get
          cors: true
          integration: lambda

  lista_objetos_bucket:
    handler: lista_objetos_bucket.lambda_handler
    memorySize: 256
    events:
      - http:
          path: /s3/bucket/lista-objetos
          method: post
          cors: true
          integration: lambda

  # ---------- Ejercicio 4 (propuesto) ----------
  crear_bucket:
    handler: s3_ops.crear_bucket
    memorySize: 256
    events:
      - http:
          path: /s3/bucket/crear
          method: post
          cors: true
          integration: lambda

  crear_directorio:
    handler: s3_ops.crear_directorio
    memorySize: 256
    events:
      - http:
          path: /s3/directorio/crear
          method: post
          cors: true
          integration: lambda

  subir_archivo:
    handler: s3_ops.subir_archivo
    memorySize: 512
    events:
      - http:
          path: /s3/archivo/subir
          method: post
          cors: true
          integration: lambda
